name: PizzaStore CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'kubernetes/**'
      - '.github/workflows/pizzastore-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ibraheempizzastoreacr
  REGISTRY: ibraheempizzastoreacr.azurecr.io
  IMAGE_NAME: pizzastore-api
  RESOURCE_GROUP: rg-pizzastore-dev
  AKS_CLUSTER: pizzastore
  IMAGE_TAG: ${{ github.sha }}
  AZURE_CORE_OUTPUT: none

jobs:
  build-and-deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PizzaStore.Api/PizzaStore.Api.csproj

      - name: Build API
        run: >
          dotnet build src/PizzaStore.Api/PizzaStore.Api.csproj
          --configuration Release
          --no-restore

      - name: Build Docker image
        run: |
          docker build \
            -f src/PizzaStore.Api/Dockerfile \
            -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker with ACR
        run: az acr login --name "$ACR_NAME"

      - name: Push image to ACR
        run: docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify image in ACR
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --output none

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.2.22'

      - name: Configure AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Apply persistent storage
        run: kubectl apply -f kubernetes/pizzastore-pvc.yaml

      - name: Prepare deployment manifest
        run: |
          sed \
            "s|ibraheempizzastoreacr.azurecr.io/pizzastore-api:v1|$REGISTRY/$IMAGE_NAME:$IMAGE_TAG|g" \
            kubernetes/pizzastore-deployment.yaml \
            > "$RUNNER_TEMP/pizzastore-deployment.yaml"

      - name: Deploy application
        run: |
          kubectl apply -f "$RUNNER_TEMP/pizzastore-deployment.yaml"
          kubectl apply -f kubernetes/pizzastore-service.yaml

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/pizzastore --timeout=180s
          kubectl get deployments,pods,services,pvc
